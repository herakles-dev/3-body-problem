name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # The whole suite is CPU-safe: NBodySimulation falls back to the
      # Warp "cpu" device whenever wp.is_cuda_available() is false (see
      # src/physics/nbody.py), and test_physics.py already requests
      # device="cpu" explicitly, so nothing here needs a GPU. The one
      # skip is test_integration_with_real_audio, which skips itself
      # when the local audio fixture (assets/audio/, gitignored) isn't
      # present -- that's a missing fixture, not a CUDA requirement.
      - name: Run pytest suite
        run: python -m pytest tests/ -v

      # test_camera_director.py, test_camera_modes.py, and
      # test_moment_detector.py are plain scripts (no pytest functions,
      # so pytest collects 0 items from them) that assert at module
      # scope and print a checklist. Run them directly so a regression
      # actually fails the build instead of passing silently.
      - name: Run script-style tests
        run: |
          python tests/test_camera_director.py
          python tests/test_camera_modes.py
          python tests/test_moment_detector.py
